<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slow Breath Copilot</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #1c2028;
      --text: #e6e8ee;
      --accent: #6bc2ff;
      --muted: #9aa3b2;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1b202a, var(--bg));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 18px;
    }

    .breath-circle {
      width: 48vmin;
      height: 48vmin;
      min-width: 200px;
      min-height: 200px;
      max-width: 480px;
      max-height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7bd6ff, #3e7bd8);
      box-shadow: 0 25px 60px rgba(35, 126, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: scale(0.78);
      transition: transform 0.18s ease-out;
      position: relative;
      outline: none;
      border: 3px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .breath-circle.inhale { transform: scale(1); }
    .breath-circle.exhale { transform: scale(0.64); }
    .breath-circle.pause { transform: scale(0.78); }

    .breath-circle:focus-visible { box-shadow: 0 0 0 4px rgba(107, 194, 255, 0.4); }

    .circle-label {
      position: relative;
      z-index: 2;
      font-size: clamp(1rem, 2.8vmin, 2rem);
      color: rgba(255, 255, 255, 0.95);
      text-align: center;
      display: grid;
      gap: 6px;
      padding: 12px;
    }

    .circle-phase { font-weight: 700; }
    .circle-time { font-size: 0.82em; color: rgba(255, 255, 255, 0.84); }

    .panel {
      width: min(900px, 100%);
      background: var(--panel);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .duration-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .duration-title { font-size: 0.85rem; color: var(--muted); }
    .duration-buttons { display: flex; flex-wrap: wrap; gap: 8px; }

    .duration-btn {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #364055;
      background: #11151c;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .duration-btn.active {
      background: var(--accent);
      border-color: transparent;
      color: #0a1020;
      box-shadow: 0 8px 16px rgba(107, 194, 255, 0.28);
    }

    .session-chip {
      font-size: 0.95rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      padding: 7px 12px;
    }

    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    button.primary {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      background: var(--accent);
      color: #0a1020;
    }

    .status-minimal { color: var(--muted); font-size: 0.95rem; }
    .status-minimal.alert { color: var(--danger); font-weight: 600; }

    .toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--muted); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .metric-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .breath-circle { width: 62vmin; height: 62vmin; min-width: 180px; min-height: 180px; }
    }
  </style>
</head>
<body>
  <div
    id="breathCircle"
    class="breath-circle pause"
    role="button"
    tabindex="0"
    aria-label="Круг дыхания: удерживайте левую кнопку мыши для вдоха и правую для выдоха"
  >
    <div class="circle-label">
      <div class="circle-phase" id="phaseName">Готовность</div>
      <div class="circle-time" id="phaseTime">Нажмите «Старт»</div>
    </div>
  </div>

  <section class="panel" aria-live="polite">
    <div>
      <div class="duration-row">
        <div class="duration-title">Длительность сессии</div>
        <div class="session-chip" id="sessionPlan">План: —</div>
      </div>
      <div id="durationButtons" class="duration-buttons" role="group" aria-label="Пресеты длительности"></div>
    </div>

    <div class="actions">
      <button id="startButton" class="primary" type="button">Старт</button>
      <div id="statusText" class="status-minimal">Ожидание старта</div>
      <div class="toggle">
        <input id="soundToggle" type="checkbox" checked />
        <label for="soundToggle">Мягкий звук при отвлечении</label>
      </div>
    </div>

    <div class="metrics">
      <div class="metric-card"><div class="metric-label">Состояние</div><div class="metric-value" id="stateMetric">Пауза</div></div>
      <div class="metric-card"><div class="metric-label">Прошло</div><div class="metric-value" id="elapsedMetric">00:00</div></div>
      <div class="metric-card"><div class="metric-label">Осталось</div><div class="metric-value" id="remainingMetric">00:00</div></div>
      <div class="metric-card"><div class="metric-label">Вдохов</div><div class="metric-value" id="inhaleCountMetric">0</div></div>
      <div class="metric-card"><div class="metric-label">Выдохов</div><div class="metric-value" id="exhaleCountMetric">0</div></div>
      <div class="metric-card"><div class="metric-label">Средний вдох</div><div class="metric-value" id="inhaleAvgMetric">—</div></div>
      <div class="metric-card"><div class="metric-label">Средний выдох</div><div class="metric-value" id="exhaleAvgMetric">—</div></div>
      <div class="metric-card"><div class="metric-label">Выдох / вдох</div><div class="metric-value" id="ratioMetric">—</div></div>
    </div>
  </section>

  <script>
    const circle = document.getElementById("breathCircle");
    const phaseName = document.getElementById("phaseName");
    const phaseTime = document.getElementById("phaseTime");
    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("statusText");
    const durationButtons = document.getElementById("durationButtons");
    const sessionPlan = document.getElementById("sessionPlan");
    const soundToggle = document.getElementById("soundToggle");

    const stateMetric = document.getElementById("stateMetric");
    const elapsedMetric = document.getElementById("elapsedMetric");
    const remainingMetric = document.getElementById("remainingMetric");
    const inhaleCountMetric = document.getElementById("inhaleCountMetric");
    const exhaleCountMetric = document.getElementById("exhaleCountMetric");
    const inhaleAvgMetric = document.getElementById("inhaleAvgMetric");
    const exhaleAvgMetric = document.getElementById("exhaleAvgMetric");
    const ratioMetric = document.getElementById("ratioMetric");

    const DURATION_PRESETS = {
      short: { label: "3 мин", seconds: 180 },
      medium: { label: "5 мин", seconds: 300 },
      long: { label: "8 мин", seconds: 480 },
      ten: { label: "10 мин", seconds: 600 },
      fifteen: { label: "15 мин", seconds: 900 },
    };

    const MIN_VALID_HOLD_MS = 140;
    const INACTIVITY_THRESHOLD_MS = 15000;

    const app = {
      durationKey: "medium",
      running: false,
      sessionStartMs: null,
      sessionEndMs: null,
      tickRaf: null,
      currentState: "pause",
      inhaleActive: false,
      exhaleActive: false,
      inhaleStartedAtMs: null,
      exhaleStartedAtMs: null,
      lastActivityAtMs: null,
      alertActive: false,
      inhaleDurationsMs: [],
      exhaleDurationsMs: [],
      inhaleCount: 0,
      exhaleCount: 0,
      lastSessionElapsedMs: 0,
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let ambientOsc = null;
    let ambientGain = null;

    const ensureAudio = async () => {
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }
    };

    const avg = (arr) => (arr.length ? arr.reduce((sum, x) => sum + x, 0) / arr.length : 0);
    const formatMs = (ms) => `${(ms / 1000).toFixed(1)} сек`;

    const formatClock = (ms) => {
      const sec = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = (sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    };

    const getSessionDurationMs = () => DURATION_PRESETS[app.durationKey].seconds * 1000;

    const startAlert = () => {
      if (app.alertActive || !soundToggle.checked) {
        app.alertActive = true;
        return;
      }
      const now = audioCtx.currentTime;
      ambientOsc = audioCtx.createOscillator();
      ambientGain = audioCtx.createGain();
      ambientOsc.type = "sine";
      ambientOsc.frequency.value = 220;
      ambientGain.gain.setValueAtTime(0.0001, now);
      ambientGain.gain.exponentialRampToValueAtTime(0.022, now + 0.8);
      ambientOsc.connect(ambientGain);
      ambientGain.connect(audioCtx.destination);
      ambientOsc.start();
      app.alertActive = true;
    };

    const stopAlert = () => {
      app.alertActive = false;
      if (ambientGain && ambientOsc) {
        const now = audioCtx.currentTime;
        ambientGain.gain.cancelScheduledValues(now);
        ambientGain.gain.setValueAtTime(Math.max(ambientGain.gain.value, 0.0001), now);
        ambientGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
        ambientOsc.stop(now + 0.35);
      }
      setTimeout(() => {
        if (ambientOsc) {
          ambientOsc.disconnect();
          ambientOsc = null;
        }
        if (ambientGain) {
          ambientGain.disconnect();
          ambientGain = null;
        }
      }, 450);
    };

    const clearHolds = () => {
      if (app.inhaleActive) endInhale(performance.now());
      if (app.exhaleActive) endExhale(performance.now());
      app.inhaleActive = false;
      app.exhaleActive = false;
      app.inhaleStartedAtMs = null;
      app.exhaleStartedAtMs = null;
      app.currentState = "pause";
      circle.classList.remove("inhale", "exhale");
      circle.classList.add("pause");
    };

    const resetMetrics = () => {
      app.inhaleDurationsMs = [];
      app.exhaleDurationsMs = [];
      app.inhaleCount = 0;
      app.exhaleCount = 0;
    };

    const setActivityNow = () => {
      app.lastActivityAtMs = performance.now();
      stopAlert();
    };

    const startInhale = (now) => {
      if (!app.running) return;
      if (app.exhaleActive) endExhale(now);
      app.inhaleActive = true;
      app.inhaleStartedAtMs = now;
      app.currentState = "inhale";
      circle.classList.remove("pause", "exhale");
      circle.classList.add("inhale");
      setActivityNow();
    };

    const endInhale = (now) => {
      if (!app.inhaleActive || app.inhaleStartedAtMs == null) return;
      const duration = now - app.inhaleStartedAtMs;
      if (duration >= MIN_VALID_HOLD_MS) {
        app.inhaleDurationsMs.push(duration);
        app.inhaleCount += 1;
      }
      app.inhaleActive = false;
      app.inhaleStartedAtMs = null;
      app.currentState = app.exhaleActive ? "exhale" : "pause";
      circle.classList.remove("inhale");
      circle.classList.add(app.exhaleActive ? "exhale" : "pause");
      setActivityNow();
    };

    const startExhale = (now) => {
      if (!app.running) return;
      if (app.inhaleActive) endInhale(now);
      app.exhaleActive = true;
      app.exhaleStartedAtMs = now;
      app.currentState = "exhale";
      circle.classList.remove("pause", "inhale");
      circle.classList.add("exhale");
      setActivityNow();
    };

    const endExhale = (now) => {
      if (!app.exhaleActive || app.exhaleStartedAtMs == null) return;
      const duration = now - app.exhaleStartedAtMs;
      if (duration >= MIN_VALID_HOLD_MS) {
        app.exhaleDurationsMs.push(duration);
        app.exhaleCount += 1;
      }
      app.exhaleActive = false;
      app.exhaleStartedAtMs = null;
      app.currentState = app.inhaleActive ? "inhale" : "pause";
      circle.classList.remove("exhale");
      circle.classList.add(app.inhaleActive ? "inhale" : "pause");
      setActivityNow();
    };

    const stopSession = () => {
      const now = performance.now();
      const elapsedMs = app.sessionStartMs == null
        ? 0
        : Math.max(0, Math.min(getSessionDurationMs(), now - app.sessionStartMs));
      app.lastSessionElapsedMs = elapsedMs;
      app.running = false;
      if (app.tickRaf) {
        cancelAnimationFrame(app.tickRaf);
        app.tickRaf = null;
      }
      clearHolds();
      stopAlert();
      startButton.textContent = "Старт";

      const inhaleAvgMs = avg(app.inhaleDurationsMs);
      const exhaleAvgMs = avg(app.exhaleDurationsMs);
      if (app.inhaleCount || app.exhaleCount) {
        statusText.textContent = `Сессия завершена: ${formatClock(elapsedMs)} · вдохов ${app.inhaleCount}, выдохов ${app.exhaleCount}`;
      } else {
        statusText.textContent = `Сессия завершена: ${formatClock(elapsedMs)}`;
      }
      statusText.classList.remove("alert");
      phaseName.textContent = "Готовность";
      phaseTime.textContent = `Сессия: ${formatClock(elapsedMs)} · Нажмите «Старт»`;
      stateMetric.textContent = "Пауза";
      elapsedMetric.textContent = formatClock(elapsedMs);
      remainingMetric.textContent = formatClock(Math.max(0, getSessionDurationMs() - elapsedMs));
      inhaleAvgMetric.textContent = inhaleAvgMs ? formatMs(inhaleAvgMs) : "—";
      exhaleAvgMetric.textContent = exhaleAvgMs ? formatMs(exhaleAvgMs) : "—";
      ratioMetric.textContent = inhaleAvgMs && exhaleAvgMs ? (exhaleAvgMs / inhaleAvgMs).toFixed(2) : "—";
    };

    const tick = () => {
      if (!app.running || app.sessionStartMs == null || app.sessionEndMs == null) return;
      const now = performance.now();
      const elapsed = now - app.sessionStartMs;
      const remaining = app.sessionEndMs - now;

      if (remaining <= 0) {
        stopSession();
        return;
      }

      const inhaleAvgMs = avg(app.inhaleDurationsMs);
      const exhaleAvgMs = avg(app.exhaleDurationsMs);

      const phaseMap = { inhale: "Вдох", exhale: "Выдох", pause: "Пауза" };
      phaseName.textContent = phaseMap[app.currentState];
      const activeHoldMs = app.inhaleActive && app.inhaleStartedAtMs != null
        ? now - app.inhaleStartedAtMs
        : app.exhaleActive && app.exhaleStartedAtMs != null
          ? now - app.exhaleStartedAtMs
          : null;
      if (activeHoldMs != null) {
        const holdLabel = app.inhaleActive ? "Вдох" : "Выдох";
        phaseTime.textContent = `${holdLabel}: ${(activeHoldMs / 1000).toFixed(1)} сек`;
      } else {
        phaseTime.textContent = `Прошло ${formatClock(elapsed)} · Осталось ${formatClock(remaining)}`;
      }
      stateMetric.textContent = phaseMap[app.currentState];
      elapsedMetric.textContent = formatClock(elapsed);
      remainingMetric.textContent = formatClock(remaining);
      inhaleCountMetric.textContent = String(app.inhaleCount);
      exhaleCountMetric.textContent = String(app.exhaleCount);
      inhaleAvgMetric.textContent = inhaleAvgMs ? formatMs(inhaleAvgMs) : "—";
      exhaleAvgMetric.textContent = exhaleAvgMs ? formatMs(exhaleAvgMs) : "—";
      ratioMetric.textContent = inhaleAvgMs && exhaleAvgMs ? (exhaleAvgMs / inhaleAvgMs).toFixed(2) : "—";

      const inactivityMs = app.inhaleActive || app.exhaleActive
        ? 0
        : (app.lastActivityAtMs ? now - app.lastActivityAtMs : 0);
      if (inactivityMs > INACTIVITY_THRESHOLD_MS) {
        startAlert();
        statusText.textContent = "Похоже, вы отвлеклись — мягкий сигнал включён";
        statusText.classList.add("alert");
      } else {
        statusText.textContent = "Свободное дыхание: ЛКМ вдох, ПКМ выдох";
        statusText.classList.remove("alert");
      }

      app.tickRaf = requestAnimationFrame(tick);
    };

    const startSession = async () => {
      await ensureAudio();
      stopAlert();
      app.running = true;
      app.sessionStartMs = performance.now();
      app.sessionEndMs = app.sessionStartMs + getSessionDurationMs();
      app.currentState = "pause";
      app.lastActivityAtMs = app.sessionStartMs;
      resetMetrics();
      inhaleCountMetric.textContent = "0";
      exhaleCountMetric.textContent = "0";
      startButton.textContent = "Стоп";
      statusText.textContent = "Свободное дыхание: ЛКМ вдох, ПКМ выдох";
      statusText.classList.remove("alert");
      clearHolds();
      tick();
    };

    const renderDurations = () => {
      durationButtons.innerHTML = "";
      Object.entries(DURATION_PRESETS).forEach(([key, preset]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "duration-btn";
        button.dataset.duration = key;
        button.textContent = preset.label;
        button.classList.toggle("active", key === app.durationKey);
        button.addEventListener("click", () => {
          app.durationKey = key;
          renderDurations();
          sessionPlan.textContent = `План: ${preset.label}`;
          if (!app.running) {
            remainingMetric.textContent = formatClock(getSessionDurationMs());
          }
        });
        durationButtons.appendChild(button);
      });
      sessionPlan.textContent = `План: ${DURATION_PRESETS[app.durationKey].label}`;
      remainingMetric.textContent = formatClock(getSessionDurationMs());
    };

    startButton.addEventListener("click", () => {
      if (app.running) {
        stopSession();
      } else {
        startSession();
      }
    });

    circle.addEventListener("contextmenu", (event) => event.preventDefault());

    circle.addEventListener("pointerdown", async (event) => {
      if (!app.running) return;
      event.preventDefault();
      await ensureAudio();
      const now = performance.now();
      if (event.button === 0) startInhale(now);
      if (event.button === 2) startExhale(now);
    });

    window.addEventListener("pointerup", (event) => {
      if (!app.running) return;
      const now = performance.now();
      if (event.button === 0) endInhale(now);
      if (event.button === 2) endExhale(now);
    });

    window.addEventListener("pointercancel", () => {
      if (!app.running) return;
      clearHolds();
      setActivityNow();
    });

    window.addEventListener("blur", () => {
      if (!app.running) return;
      clearHolds();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && app.running) {
        clearHolds();
      }
    });

    window.addEventListener("load", () => {
      renderDurations();
      phaseName.textContent = "Готовность";
      phaseTime.textContent = "Нажмите «Старт»";
      stateMetric.textContent = "Пауза";
      elapsedMetric.textContent = "00:00";
      inhaleCountMetric.textContent = "0";
      exhaleCountMetric.textContent = "0";
      inhaleAvgMetric.textContent = "—";
      exhaleAvgMetric.textContent = "—";
      ratioMetric.textContent = "—";
    });
  </script>
</body>
</html>
